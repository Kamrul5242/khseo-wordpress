# Local integration environment: real WordPress + MariaDB + WP-CLI.
# Usage (from the repo root):
#   docker compose -f tools/docker-compose.yml up -d db wordpress
#   docker compose -f tools/docker-compose.yml run --rm cli bash /plugin/tools/integration-test.sh
#   docker compose -f tools/docker-compose.yml down -v
name: khseo-dev

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8089:80"
    # Apache also listens on 8089 INSIDE the container, so the site's own URL
    # (http://localhost:8089) is reachable when KHSEO audits itself from PHP.
    command:
      - bash
      - -c
      - >-
        echo 'Listen 8089' >> /etc/apache2/ports.conf &&
        sed -i 's/<VirtualHost \*:80>/<VirtualHost *:80 *:8089>/' /etc/apache2/sites-enabled/000-default.conf &&
        exec docker-entrypoint.sh apache2-foreground
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/khseo:ro

  cli:
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/khseo:ro
      - ..:/plugin:ro

volumes:
  wp:
